# declare a Cargo workspace to manage all crates together.
[workspace]
members = ["ast", "lexer", "parser", "runtime", "cli", "repl"]

resolver = "3"

# Optional: make all crates use the same edition and lint settings via Workspace inheritence
[workspace.package]
edition = "2024"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
